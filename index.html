<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Infinite Drive 3D</title>
  <style>
    html,body{margin:0;height:100%;background:#67B3FF;overflow:hidden}
    #hud{position:absolute;top:16px;left:16px;z-index:10}
    #hud .card{background:rgba(0,0,0,.7);border:1px solid #11e233;color:#11e233;border-radius:8px;padding:10px 16px;margin-bottom:8px;font-size:18px}
    #controls{position:absolute;bottom:16px;right:16px;z-index:10;background:rgba(0,0,0,.7);border:1px solid #11e233;border-radius:8px;padding:10px;color:#11e233}
    #options{position:absolute;top:16px;right:16px;z-index:10;background:rgba(0,0,0,.78);border:1px solid #11e233;border-radius:8px;padding:12px;color:#11e233;min-width:260px}
    #options h3{margin:0 0 8px 0;font-size:16px}
    .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
    .row label{font-size:12px;margin-right:8px}
    .row input[type=range]{width:150px}
    canvas{display:block}
  </style>
</head>
<body>
  <div id="hud">
    <div class="card">Vitesse: <span id="speed">0</span> km/h</div>
    <div class="card">Distance: <span id="distance">0</span> m</div>
    <div class="card">FPS: <span id="fps">60</span></div>
  </div>
  <div id="controls" class="card">W/S/↑/↓ Accélérer/Freiner — A/D/←/→ Tourner — R Reset — O Options</div>
  <div id="options" class="card">
    <h3>Options de conduite</h3>
    <div class="row"><label>Vitesse max</label><input id="opt_vmax" type="range" min="2" max="9" value="5.2" step="0.1"><span id="opt_vmax_v">5.2</span></div>
    <div class="row"><label>Accélération</label><input id="opt_accel" type="range" min="3" max="16" value="8" step="0.1"><span id="opt_accel_v">8</span></div>
    <div class="row"><label>Freinage</label><input id="opt_brake" type="range" min="3" max="16" value="7" step="0.1"><span id="opt_brake_v">7</span></div>
    <div class="row"><label>Friction</label><input id="opt_friction" type="range" min="1" max="8" value="4.2" step="0.1"><span id="opt_friction_v">4.2</span></div>
    <div class="row"><label>Virage (base)</label><input id="opt_steer" type="range" min="0.6" max="2.8" value="1.3" step="0.05"><span id="opt_steer_v">1.3</span></div>
    <div class="row"><label>Gain avec vitesse</label><input id="opt_gain" type="range" min="6" max="24" value="11" step="0.5"><span id="opt_gain_v">11</span></div>
    <div class="row"><label>Sensibilité</label><input id="opt_sense" type="range" min="0.2" max="1.0" value="0.48" step="0.02"><span id="opt_sense_v">0.48</span></div>
    <div class="row"><button id="closeOpt">Fermer (O)</button><button id="resetOpt" style="margin-left:8px">Par défaut</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  // Idée: remplacer les petits segments par UNE géométrie ruban (TubeGeometry) qui serpente à l'infini.
  // On met à jour un chemin "spline" de points, et on reconstruit le tube à faible cadence pour éviter les cassures.

  const SETTINGS = { accel:8, brake:7, steerBase:1.3, steerGainSpeed:11, friction:4.2, vmax:5.2, sense:0.48 };

  let scene, camera, renderer; let car, keys={}, velocity=new THREE.Vector3(), rotation=0;
  let distance=0, frames=0, lastFPS=performance.now();

  // Route ruban
  let roadMesh, roadMat, roadRadius=6.5, pathPoints=[], pathLength=60, pointSpacing=8; // 60 points * 8m ≈ 480m visibles
  let lateralOffset=0, targetCurv=0, curv=0, targetSlope=0, slope=0;

  // éléments secondaires
  let barriersLeft, barriersRight, grassLeft, grassRight, sky;

  function T(id){ return document.getElementById(id); }
  function setText(id,v){ const el=T(id); if(el) el.textContent=v; }

  function createScene(){
    if(scene){ while(scene.children.length>0){ scene.remove(scene.children[0]); } }
    scene=new THREE.Scene();
    sky=new THREE.Mesh(new THREE.SphereGeometry(1800, 18, 18), new THREE.MeshBasicMaterial({color:0x87CEEB, side:THREE.BackSide})); scene.add(sky);
    scene.fog=new THREE.Fog(0x87CEEB, 90, 1400);

    camera=new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 3000); camera.position.set(0,9,14);
    if(!renderer){ renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement); }
    renderer.setClearColor(0x87CEEB,1);
    scene.add(new THREE.AmbientLight(0x4a4a4a, 2.0)); const sun=new THREE.DirectionalLight(0xffffff,1.05); sun.position.set(80,120,30); scene.add(sun);

    // Initialise le chemin
    pathPoints=[]; let z=0, x=0, y=0; for(let i=0;i<pathLength;i++){ pathPoints.push(new THREE.Vector3(x,y,z)); z+=pointSpacing; }

    // Crée la route ruban (TubeGeometry)
    roadMat=new THREE.MeshLambertMaterial({ color:0x363636 });
    roadMesh = buildRoadMesh(); scene.add(roadMesh);

    // Bandes latérales (textures simples via lignes extrudées)
    barriersLeft = buildBarrierMesh(-roadRadius-0.7); scene.add(barriersLeft);
    barriersRight= buildBarrierMesh( roadRadius+0.7); scene.add(barriersRight);

    // Herbe (deux grands plans infinis qui suivent la route localement)
    grassLeft = buildGrassStrip(-roadRadius-6); scene.add(grassLeft);
    grassRight= buildGrassStrip( roadRadius+6); scene.add(grassRight);

    spawnCar();
  }

  function buildRoadMesh(){
    const curve = new THREE.CatmullRomCurve3(pathPoints, false, 'catmullrom', 0.1);
    const tubularSegments = 200; // assez fin pour la fluidité
    const geometry = new THREE.TubeGeometry(curve, tubularSegments, roadRadius, 16, false);
    // Aplatir pour obtenir un ruban (on garde la forme tube puis on scale Y)
    geometry.scale(1, 0.02, 1); // rend le tube plat
    // Marquage central via une deuxième géométrie fine
    const mesh = new THREE.Mesh(geometry, roadMat);
    mesh.receiveShadow=true; return mesh;
  }
  function buildBarrierMesh(offsetX){
    // Un tube plus fin décalé latéralement -> converti en "muret" en l’aplatissant
    const pts = pathPoints.map(p=> new THREE.Vector3(p.x+offsetX, p.y+0.4, p.z));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
    const geom = new THREE.TubeGeometry(curve, 200, 0.3, 6, false); geom.scale(1,0.8,1);
    return new THREE.Mesh(geom, new THREE.MeshLambertMaterial({color:0xbfbfbf}));
  }
  function buildGrassStrip(offsetX){
    const geom = new THREE.PlaneGeometry(800, 800);
    const mesh = new THREE.Mesh(geom, new THREE.MeshLambertMaterial({color:0x2abc3a}));
    mesh.rotation.x = -Math.PI/2; mesh.position.set(offsetX, -0.1, 400);
    return mesh;
  }

  function advancePath(){
    // Ajoute un nouveau point devant et retire un derrière pour simuler l’infini, en imposant des courbes/pentes lissées
    const last = pathPoints[pathPoints.length-1].clone();
    // cible virage/pente plus prononcés mais lissés
    if(Math.random()<0.02){ targetCurv=(Math.random()*1.6-0.8); }
    if(Math.random()<0.02){ targetSlope=(Math.random()*0.8-0.4); }
    curv += (targetCurv - curv)*0.05; slope += (targetSlope - slope)*0.04;
    // Offset latéral par courbure cumulée
    lateralOffset += curv * 0.9;
    last.z += pointSpacing;
    last.x = lateralOffset;
    last.y += Math.sin(slope)*0.8; // relief plus visible

    pathPoints.push(last);
    pathPoints.shift();
  }

  // Reconstruction à cadence réduite
  let rebuildTimer=0;
  function maybeRebuild(dt){ rebuildTimer+=dt; if(rebuildTimer>0.12){ rebuildTimer=0; scene.remove(roadMesh); roadMesh.geometry.dispose(); roadMesh=buildRoadMesh(); scene.add(roadMesh); scene.remove(barriersLeft); scene.remove(barriersRight); barriersLeft=buildBarrierMesh(-roadRadius-0.7); barriersRight=buildBarrierMesh(roadRadius+0.7); scene.add(barriersLeft); scene.add(barriersRight); } }

  // Voiture
  function spawnCar(){ car=new THREE.Group(); const body=new THREE.Mesh(new THREE.BoxGeometry(2,1,3.6), new THREE.MeshLambertMaterial({color:0xff3838})); body.position.y=0.5; car.add(body); const roof=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,1.9), new THREE.MeshLambertMaterial({color:0xdd1b1b})); roof.position.set(0,1.0,-0.1); car.add(roof); const wGeo=new THREE.CylinderGeometry(0.38,0.38,0.22,12), wMat=new THREE.MeshLambertMaterial({color:0x222222}); [[-1,0.28,1.2],[1,0.28,1.2],[-1,0.28,-1.25],[1,0.28,-1.25]].forEach(p=>{const w=new THREE.Mesh(wGeo,wMat); w.rotation.z=Math.PI/2; w.position.set(...p); car.add(w);}); car.position.set(0,0,5); scene.add(car); }

  // Player
  function updatePlayer(dt){ let thrust=0; if(keys['KeyW']||keys['ArrowUp']) thrust += SETTINGS.accel; if(keys['KeyS']||keys['ArrowDown']) thrust -= SETTINGS.brake; const sp=velocity.length(); let steer=0; if(sp>0.12){ if(keys['KeyA']||keys['ArrowLeft']) steer += SETTINGS.steerBase*Math.min(sp/SETTINGS.steerGainSpeed,1); if(keys['KeyD']||keys['ArrowRight']) steer -= SETTINGS.steerBase*Math.min(sp/SETTINGS.steerGainSpeed,1); } rotation += steer * dt * SETTINGS.sense; velocity.x += Math.sin(rotation)*thrust*dt; velocity.z += Math.cos(rotation)*thrust*dt; const fr=Math.exp(-SETTINGS.friction*dt); velocity.multiplyScalar(fr); const vmax=SETTINGS.vmax; if(velocity.length()>vmax) velocity.setLength(vmax); car.position.add(velocity); car.rotation.y=rotation; distance=Math.max(distance, car.position.z); // collisions latérales simples avec largeur route
    const minX=-roadRadius+0.6, maxX=roadRadius-0.6; if(car.position.x<minX){ car.position.x=minX; velocity.x=Math.abs(velocity.x)*0.15;} if(car.position.x>maxX){ car.position.x=maxX; velocity.x=-Math.abs(velocity.x)*0.15; } }

  function updateCamera(){ const p=car.position, r=rotation; camera.position.lerp(new THREE.Vector3(p.x-Math.sin(r)*13, p.y+7, p.z-Math.cos(r)*13), 0.12); camera.lookAt(new THREE.Vector3(p.x,p.y+1,p.z)); }
  function updateHUD(t){ setText('speed', Math.round(velocity.length()*36)); setText('distance', Math.round(Math.abs(car.position.z))); frames++; if(t-lastFPS>1000){ setText('fps', Math.round(frames*1000/(t-lastFPS))); frames=0; lastFPS=t; } }

  // Input & boucle
  addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='KeyR'){ lateralOffset=0; curv=targetCurv=0; slope=targetSlope=0; distance=0; velocity.set(0,0,0); rotation=0; createScene(); } if(e.code==='KeyO') toggleOptions(); });
  addEventListener('keyup', e=> keys[e.code]=false);
  addEventListener('resize', ()=>{ if(camera&&renderer){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }});

  function loop(){ requestAnimationFrame(loop); const now=performance.now(); if(!loop.last) loop.last=now; const dt=Math.min(0.033,(now-loop.last)/1000); loop.last=now; advancePath(); maybeRebuild(dt); updatePlayer(dt); updateCamera(); updateHUD(now); renderer.render(scene,camera); }

  window.addEventListener('load', ()=>{ if(typeof THREE==='undefined'){ alert('Three.js non chargé'); return; } createScene(); bindOptions(); loop(); });

  function bindOptions(){ const pairs=[["opt_vmax","vmax"],["opt_accel","accel"],["opt_brake","brake"],["opt_friction","friction"],["opt_steer","steerBase"],["opt_gain","steerGainSpeed"],["opt_sense","sense"]]; pairs.forEach(([id,k])=>{ const s=T(id), v=T(id+"_v"); if(!s||!v) return; v.textContent=s.value; s.addEventListener('input',()=>{ SETTINGS[k]=parseFloat(s.value); v.textContent=s.value; }); }); T('closeOpt').addEventListener('click', toggleOptions); T('resetOpt').addEventListener('click', ()=>{ [["opt_vmax",5.2],["opt_accel",8],["opt_brake",7],["opt_friction",4.2],["opt_steer",1.3],["opt_gain",11],["opt_sense",0.48]].forEach(([id,val])=>{ const s=T(id), v=T(id+"_v"); s.value=val; v.textContent=val; }); Object.assign(SETTINGS,{vmax:5.2,accel:8,brake:7,friction:4.2,steerBase:1.3,steerGainSpeed:11,sense:0.48}); }); }
  function toggleOptions(){ const p=T('options'); p.style.display=(p.style.display==='none'?'block':'none'); }
  </script>
</body>
</html>
