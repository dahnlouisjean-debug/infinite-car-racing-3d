<!DOCTYPE html>
<html>
<head>
    <title>Jeu de Voiture 3D Simple</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #00ff00;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="loading">Chargement...</div>
    <div id="info" style="display:none;">
        <div>Vitesse: <span id="speed">0</span> km/h</div>
        <div>Contrôles: WASD ou flèches</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Variables globales
        let scene, camera, renderer, car, keys = {};
        let speed = 0;

        // Initialisation
        function init() {
            console.log('Démarrage du jeu...');
            
            // Scène
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87ceeb, 50, 200);
            
            // Caméra
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87ceeb);
            document.body.appendChild(renderer.domElement);
            
            // Lumières
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);
            
            // Route
            const roadGeometry = new THREE.PlaneGeometry(20, 200);
            const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);
            
            // Ligne blanche
            const lineGeometry = new THREE.PlaneGeometry(0.5, 200);
            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.rotation.x = -Math.PI / 2;
            line.position.y = 0.01;
            scene.add(line);
            
            // Voiture (simple cube rouge)
            const carGeometry = new THREE.BoxGeometry(2, 1, 4);
            const carMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            car = new THREE.Mesh(carGeometry, carMaterial);
            car.position.y = 0.5;
            scene.add(car);
            
            // Roues
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 8);
            const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });
            
            for (let i = 0; i < 4; i++) {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                const x = i < 2 ? -0.8 : 0.8;
                const z = i % 2 === 0 ? 1.5 : -1.5;
                wheel.position.set(x, 0.4, z);
                car.add(wheel);
            }
            
            // Contrôles
            setupControls();
            
            // Cacher le loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            
            console.log('Jeu prêt !');
            
            // Boucle de jeu
            animate();
        }
        
        function setupControls() {
            document.addEventListener('keydown', (event) => {
                keys[event.code] = true;
            });
            
            document.addEventListener('keyup', (event) => {
                keys[event.code] = false;
            });
        }
        
        function updateCar() {
            // Accélération
            if (keys['KeyW'] || keys['ArrowUp']) {
                speed += 0.1;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                speed -= 0.1;
            }
            
            // Direction
            if (keys['KeyA'] || keys['ArrowLeft']) {
                car.rotation.y += 0.02 * Math.abs(speed);
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                car.rotation.y -= 0.02 * Math.abs(speed);
            }
            
            // Friction
            speed *= 0.98;
            
            // Limites
            speed = Math.max(-2, Math.min(speed, 5));
            
            // Déplacement
            car.position.x += Math.sin(car.rotation.y) * speed * 0.1;
            car.position.z += Math.cos(car.rotation.y) * speed * 0.1;
            
            // Caméra suit la voiture
            const idealCameraPosition = new THREE.Vector3(
                car.position.x - Math.sin(car.rotation.y) * 8,
                car.position.y + 4,
                car.position.z - Math.cos(car.rotation.y) * 8
            );
            
            camera.position.lerp(idealCameraPosition, 0.1);
            camera.lookAt(car.position);
            
            // Mise à jour UI
            document.getElementById('speed').textContent = Math.round(Math.abs(speed * 20));
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            updateCar();
            renderer.render(scene, camera);
        }
        
        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Démarrage quand Three.js est chargé
        window.addEventListener('load', () => {
            if (typeof THREE !== 'undefined') {
                init();
            } else {
                document.getElementById('loading').textContent = 'Erreur: Three.js non chargé';
            }
        });
    </script>
</body>
</html>
