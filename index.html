<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Jeu de Voiture 3D Simple</title>
  <style>
    html,body{margin:0;height:100%;background:#7CC0EF}
    #hud{position:absolute;top:16px;left:16px;z-index:10}
    #hud .card{background:rgba(0,0,0,.7);border:1px solid #11e233;color:#11e233;border-radius:8px;padding:12px 22px;margin-bottom:10px;font-size:24px;}
    #controls{position:absolute;bottom:16px;right:16px;z-index:10;background:rgba(0,0,0,.7);border:1px solid #11e233;border-radius:8px;padding:10px;color:#11e233;}
    canvas{display:block;}
  </style>
</head>
<body>
  <div id="hud">
    <div class="card">Vitesse: <span id="speed">0</span> km/h</div>
    <div class="card">Distance: <span id="distance">0</span> m</div>
    <div class="card">FPS: <span id="fps">60</span></div>
  </div>
  <div id="controls" class="card">W/S/↑/↓ Accélérer/Freiner — A/D/←/→ Tourner — R Reset</div>
  <!-- CDN alternatif jsDelivr pour Three r160 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    if(typeof THREE==='undefined'){ alert('Three.js non chargé. Réseau ou CDN bloqué.'); }
  </script>
  <script>
    let scene,camera,renderer,car,keys={},velocity={x:0,z:0},rotation=0; let segments=[],L=40,N=18;
    function init(){
      scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x87CEEB,60,700);
      camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1500); camera.position.set(0,9,14); camera.lookAt(0,0,50);
      renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x87CEEB,1); document.body.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0x404040,2)); const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(20,30,10); scene.add(sun);
      for(let i=0;i<N;i++){ const seg=new THREE.Mesh(new THREE.PlaneGeometry(18,L),new THREE.MeshLambertMaterial({color:0x454545})); seg.rotation.x=-Math.PI/2; seg.position.z=i*L; scene.add(seg); segments.push(seg); const line=new THREE.Mesh(new THREE.PlaneGeometry(0.5,L-2),new THREE.MeshBasicMaterial({color:0xffffff})); line.rotation.x=-Math.PI/2; line.position.set(0,0.01,i*L); scene.add(line);} 
      for(let i=0;i<N;i++){ [-1,1].forEach(s=>{ const g=new THREE.Mesh(new THREE.PlaneGeometry(32,L),new THREE.MeshLambertMaterial({color:0x2ccf3e})); g.rotation.x=-Math.PI/2; g.position.set(s*25,-0.1,i*L); scene.add(g);}); }
      car=new THREE.Group(); const body=new THREE.Mesh(new THREE.BoxGeometry(2,1,3.8),new THREE.MeshLambertMaterial({color:0xff3838})); body.position.y=0.5; car.add(body); const roof=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.7,2),new THREE.MeshLambertMaterial({color:0xdd1b1b})); roof.position.set(0,1,0); car.add(roof);
      const wGeo=new THREE.CylinderGeometry(0.38,0.38,0.22,12), wMat=new THREE.MeshLambertMaterial({color:0x222}); [[-1,0.28,1.2],[1,0.28,1.2],[-1,0.28,-1.25],[1,0.28,-1.25]].forEach(p=>{const w=new THREE.Mesh(wGeo,wMat); w.rotation.z=Math.PI/2; w.position.set(...p); car.add(w);});
      car.position.set(0,0,5); scene.add(car);
      addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='KeyR'){car.position.set(0,0,5); velocity.x=0; velocity.z=0; rotation=0;}});
      addEventListener('keyup',e=> keys[e.code]=false);
      let last=performance.now(), frames=0, lastFPS=performance.now();
      function loop(){ requestAnimationFrame(loop); const now=performance.now(),dt=Math.min(0.033,(now-last)/1000); last=now; let thrust=0; if(keys['KeyW']||keys['ArrowUp']) thrust+=10; if(keys['KeyS']||keys['ArrowDown']) thrust-=8; const v=Math.hypot(velocity.x,velocity.z); let steer=0; if(v>0.2){ if(keys['KeyA']||keys['ArrowLeft']) steer+=1.4*Math.min(v/12,1); if(keys['KeyD']||keys['ArrowRight']) steer-=1.4*Math.min(v/12,1);} rotation+=steer*dt*0.42; velocity.x+=Math.sin(rotation)*thrust*dt; velocity.z+=Math.cos(rotation)*thrust*dt; const fr=Math.exp(-3.3*dt); velocity.x*=fr; velocity.z*=fr; const vmax=5.5; const sp=Math.hypot(velocity.x,velocity.z); if(sp>vmax){ velocity.x=velocity.x/sp*vmax; velocity.z=velocity.z/sp*vmax; } car.position.x+=velocity.x; car.position.z+=velocity.z; car.rotation.y=rotation; const z=car.position.z, limit=z-L*4; segments.forEach(s=>{ if(s.position.z<limit) s.position.z+=N*L; }); const p=car.position,r=rotation; camera.position.lerp(new THREE.Vector3(p.x-Math.sin(r)*13,p.y+7,p.z-Math.cos(r)*13),0.15); camera.lookAt(new THREE.Vector3(p.x,p.y+1,p.z)); document.getElementById('speed').textContent=Math.round(Math.hypot(velocity.x,velocity.z)*37); document.getElementById('distance').textContent=Math.round(Math.abs(car.position.z)); frames++; if(now-lastFPS>1000){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFPS)); frames=0; lastFPS=now;} renderer.render(scene,camera);} loop(); }
    window.addEventListener('load',()=>{ if(typeof THREE!=='undefined'){ init(); } else { alert('Three.js non chargé (jsDelivr). Essaie de recharger ou vérifier internet.'); } });
    addEventListener('resize',()=>{ if(camera&&renderer){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);} });
  </script>
</body>
</html>
