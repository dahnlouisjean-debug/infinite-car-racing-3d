<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Car Racing 3D</title>
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0e1225; overflow: hidden; user-select: none; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; }
        #gameCanvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; color: #00ff41; font-size: 18px; text-shadow: 0 0 10px #00ff41; }
        #controls { position: absolute; bottom: 20px; right: 20px; z-index: 100; color: #00ff41; font-size: 14px; text-align: right; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #00ff41; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff41; font-size: 20px; z-index: 200; text-align: center; }
        #errorMessage { position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 14px; z-index: 200; text-align: center; background: rgba(0,0,0,0.8); padding: 16px; border-radius: 8px; border: 1px solid #ff4444; max-width: 80%; }
        .hidden { display: none; }
        #loadingProgress { margin-top: 8px; font-size: 13px; color: #9ad3a5; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="loading">
        INITIALISATION DU MOTEUR...<br>
        <div id="loadingProgress">Téléchargement des bibliothèques...</div>
    </div>

    <div id="errorMessage" class="hidden">
        <strong>ERREUR</strong><br>
        <span id="errorText"></span>
    </div>

    <div id="ui" class="hidden">
        <div>VITESSE: <span id="speed">0</span> km/h</div>
        <div>DISTANCE: <span id="distance">0</span> m</div>
        <div>FPS: <span id="fps">60</span></div>
    </div>

    <div id="controls" class="hidden">
        <div><strong>CONTROLES</strong></div>
        <div>↑/W - Accélération</div>
        <div>↓/S - Frein/Marche arrière</div>
        <div>←/A - Gauche</div>
        <div>→/D - Droite</div>
        <div>ESPACE - Frein à main</div>
        <div>R - Reset voiture</div>
        <div>P - Pause</div>
    </div>
</div>

<!-- Bibliothèques: lock versions et CDN robustes -->
<script>
  // Empêche le cache agressif pendant le debug
  const nocache = (url) => url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    document.getElementById('errorText').textContent = 'Échec chargement Three.js';
    document.getElementById('errorMessage').classList.remove('hidden');
  } else {
    document.getElementById('loadingProgress').textContent = 'Three.js OK. Chargement Cannon.js...';
  }
</script>
<!-- Utiliser cannon-es UMD compat: @pmndrs/cannon-es fournit un build UMD via skypack -->
<script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
<script>
  if (typeof CANNON === 'undefined') {
    document.getElementById('errorText').textContent = 'Échec chargement Cannon.js';
    document.getElementById('errorMessage').classList.remove('hidden');
  } else {
    document.getElementById('loadingProgress').textContent = 'Librairies chargées. Démarrage du jeu...';
  }
</script>
<script src="src/main.js"></script>
</body>
</html>
